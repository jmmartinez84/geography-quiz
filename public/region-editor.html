<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editor de Regiones – Cordilleras</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #1e293b; padding: 8px 16px; font-size: 13px; font-weight: 700; border-bottom: 1px solid #334155; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
    header span { color: #64748b; font-weight: 400; font-size: 11px; }
    #main { display: flex; flex: 1; overflow: hidden; }

    /* Map area */
    #map-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #020617; padding: 6px; overflow: hidden; }
    #svg { max-width: 100%; max-height: 100%; cursor: crosshair; display: block; }

    /* Sidebar */
    #panel { width: 260px; display: flex; flex-direction: column; border-left: 1px solid #334155; overflow: hidden; flex-shrink: 0; }
    #panel-head { padding: 8px 10px; font-size: 11px; color: #64748b; border-bottom: 1px solid #334155; line-height: 1.5; flex-shrink: 0; }
    #panel-head b { color: #94a3b8; }
    #range-list { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 3px; }
    .rbtn { background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 5px 8px; border-radius: 5px; cursor: pointer; text-align: left; font-size: 11px; font-family: inherit; width: 100%; display: flex; align-items: center; gap: 6px; transition: background 0.1s; }
    .rbtn:hover { background: #334155; }
    .rbtn.active { background: #1d4ed8; border-color: #3b82f6; color: #fff; }
    .rbtn .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .rbtn .check { margin-left: auto; font-size: 10px; color: #22c55e; }

    #bottom { padding: 8px; border-top: 1px solid #334155; display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    #status { font-size: 11px; color: #94a3b8; min-height: 16px; }
    .row { display: flex; gap: 5px; }
    button { padding: 5px 9px; border-radius: 4px; border: none; cursor: pointer; font-size: 11px; font-weight: 600; font-family: inherit; flex: 1; transition: opacity 0.1s; }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.35; cursor: default; }
    .r { background: #dc2626; color: #fff; }
    .b { background: #2563eb; color: #fff; }
    .g { background: #16a34a; color: #fff; }
    .y { background: #d97706; color: #fff; }

    #output { background: #020617; border: 1px solid #334155; border-radius: 4px; padding: 7px; font-family: monospace; font-size: 9.5px; color: #86efac; max-height: 120px; overflow-y: auto; white-space: pre; display: none; }
    #coords-display { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 5px 7px; font-family: monospace; font-size: 9px; color: #7dd3fc; min-height: 28px; max-height: 60px; overflow-y: auto; line-height: 1.6; word-break: break-all; }
  </style>
</head>
<body>
<header>
  🗺️ Editor de Regiones – Cordilleras de España
  <span>Haz clic para añadir puntos · Enter/botón para guardar · Backspace para deshacer · Esc para limpiar</span>
</header>
<div id="main">
  <div id="map-wrap">
    <svg id="svg" viewBox="0 0 900 680" preserveAspectRatio="xMidYMid meet">
      <image id="bg-img" href="/espana.jpg" x="0" y="0" width="900" height="680" preserveAspectRatio="none"/>
      <g id="g-saved"></g>
      <g id="g-active-fill"></g>
      <g id="g-lines"></g>
      <g id="g-preview"></g>
      <g id="g-pts"></g>
      <!-- Cursor coords display -->
      <text id="g-cursor-txt" x="5" y="670" font-size="9" font-family="monospace" fill="white" stroke="#000" stroke-width="2" paint-order="stroke" style="pointer-events:none"></text>
    </svg>
  </div>
  <div id="panel">
    <div id="panel-head">
      Selecciona una región y haz clic en el mapa para definir el polígono.<br>
      <b>Enter</b> o botón "Guardar" para cerrar y guardar.
    </div>
    <div id="range-list"></div>
    <div id="bottom">
      <div id="status">Sin región activa</div>
      <div id="coords-display">—</div>
      <div class="row">
        <button class="r" id="btn-undo" onclick="undoPoint()" disabled>↩ Deshacer</button>
        <button class="r" id="btn-clear" onclick="clearPoly()" disabled>✕ Limpiar</button>
      </div>
      <div class="row">
        <button class="g" id="btn-save" onclick="savePoly()" disabled>✓ Guardar región</button>
      </div>
      <div class="row">
        <button class="y" onclick="exportAll()">⬇ Exportar mountainRanges.ts</button>
      </div>
      <div id="output"></div>
    </div>
  </div>
</div>
<script>
// ─── Data ────────────────────────────────────────────────────────────────────
const RANGES = [
  { id:'macizo_galaico',             name:'Macizo Galaico' },
  { id:'montes_de_leon',             name:'Montes de León' },
  { id:'teleno',                     name:'Teleno' },
  { id:'cordillera_cantabrica',      name:'Cordillera Cantábrica' },
  { id:'montes_vascos',              name:'Montes Vascos' },
  { id:'pirineos',                   name:'Pirineos' },
  { id:'sistema_central',            name:'Sistema Central' },
  { id:'sistema_iberico',            name:'Sistema Ibérico' },
  { id:'cordillera_costero_catalana',name:'Cordillera Costero Catalana' },
  { id:'montes_de_toledo',           name:'Montes de Toledo' },
  { id:'sierra_morena',              name:'Sierra Morena' },
  { id:'sistemas_beticos',           name:'Sistemas Béticos' },
  { id:'teide',                      name:'Teide' },
]

const COLORS = {
  macizo_galaico:'#f97316', montes_de_leon:'#eab308', teleno:'#ef4444',
  cordillera_cantabrica:'#06b6d4', montes_vascos:'#a78bfa', pirineos:'#f472b6',
  sistema_central:'#34d399', sistema_iberico:'#60a5fa',
  cordillera_costero_catalana:'#fbbf24', montes_de_toledo:'#a3e635',
  sierra_morena:'#818cf8', sistemas_beticos:'#2dd4bf', teide:'#fb7185',
}

const HIT_ORDER = [
  'teleno','montes_de_leon','macizo_galaico','montes_vascos','cordillera_cantabrica',
  'pirineos','cordillera_costero_catalana','sistema_iberico','sistema_central',
  'montes_de_toledo','sierra_morena','sistemas_beticos','teide',
]

// Initial polygon data (current values from mountainRanges.ts)
const INITIAL = {
  macizo_galaico:             [[259,23],[242,46],[225,74],[212,103],[240,119],[276,65],[285,32],[275,24],[259,23]],
  montes_de_leon:             [[308,42],[296,62],[282,86],[270,106],[284,126],[315,129],[357,68],[346,47],[328,37],[309,42]],
  teleno:                     [[362,91],[348,92],[328,94],[323,104],[328,119],[349,116],[362,109],[363,92],[362,91]],
  cordillera_cantabrica:      [[332,13],[323,23],[323,35],[355,42],[384,55],[435,52],[466,52],[491,48],[496,39],[496,29],[419,21],[369,13],[332,13]],
  montes_vascos:              [[505,19],[502,39],[503,57],[530,58],[553,54],[563,42],[564,29],[553,22],[534,19],[523,18],[505,18],[505,19]],
  pirineos:                   [[574,24],[564,34],[559,48],[612,80],[657,90],[705,95],[756,102],[803,102],[805,77],[803,60],[739,46],[631,32],[573,23],[574,24]],
  sistema_central:            [[328,232],[306,260],[306,287],[390,275],[429,248],[507,204],[514,171],[469,156],[430,195],[364,218],[328,233]],
  sistema_iberico:            [[506,92],[469,107],[484,138],[520,173],[530,225],[574,253],[615,277],[649,277],[662,251],[661,227],[565,127],[545,99],[505,92]],
  cordillera_costero_catalana:[[822,116],[797,116],[767,119],[748,135],[729,144],[707,157],[690,180],[703,195],[757,168],[795,148],[823,116]],
  montes_de_toledo:           [[413,289],[396,301],[405,319],[427,333],[460,337],[479,311],[463,295],[435,287],[412,290]],
  sierra_morena:              [[301,393],[288,418],[299,438],[332,438],[427,415],[453,400],[469,384],[470,371],[398,364],[358,376],[319,384],[302,393]],
  sistemas_beticos:           [[525,367],[507,403],[482,432],[442,448],[389,473],[371,501],[361,532],[380,545],[414,540],[491,523],[522,521],[560,512],[571,429],[575,403],[555,370],[526,366]],
  teide:                      [[84,625],[92,645],[100,640],[105,632],[102,624],[87,624],[84,625]],
}

// ─── State ───────────────────────────────────────────────────────────────────
// saved: open polygons (without closing repeat of first point)
const saved = {}
RANGES.forEach(r => {
  const pts = INITIAL[r.id] || []
  // strip closing point if it repeats the first
  const open = (pts.length > 1 && pts[0][0] === pts[pts.length-1][0] && pts[0][1] === pts[pts.length-1][1])
    ? pts.slice(0,-1)
    : [...pts]
  saved[r.id] = open.map(p => [p[0], p[1]])
})

let activeId  = null   // which range is being edited
let pts       = []     // working points (open polygon)
let cursor    = null   // current SVG mouse position

// ─── SVG helpers ─────────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg'
const svg = document.getElementById('svg')

function el(tag, attrs) {
  const e = document.createElementNS(NS, tag)
  Object.entries(attrs).forEach(([k,v]) => e.setAttribute(k, v))
  return e
}

function svgCoords(e) {
  const rect = svg.getBoundingClientRect()
  return [
    Math.round((e.clientX - rect.left) / rect.width  * 900),
    Math.round((e.clientY - rect.top)  / rect.height * 680),
  ]
}

function centroid(polygon) {
  if (!polygon.length) return [450, 340]
  return [
    Math.round(polygon.reduce((s,p) => s+p[0], 0) / polygon.length),
    Math.round(polygon.reduce((s,p) => s+p[1], 0) / polygon.length),
  ]
}

// ─── Render ──────────────────────────────────────────────────────────────────
function render() {
  renderSaved()
  renderActive()
  renderPreview()
  renderPoints()
  updateUI()
}

function renderSaved() {
  const g = document.getElementById('g-saved')
  g.innerHTML = ''
  RANGES.forEach(r => {
    if (r.id === activeId) return
    const poly = saved[r.id]
    if (!poly || poly.length < 3) return
    const color = COLORS[r.id]
    const isActive = r.id === activeId

    g.appendChild(el('polygon', {
      points: poly.map(p => p.join(',')).join(' '),
      fill: color + '40',
      stroke: color,
      'stroke-width': '1.5',
    }))

    // Label at centroid
    const [cx, cy] = centroid(poly)
    const txt = document.createElementNS(NS, 'text')
    txt.setAttribute('x', cx)
    txt.setAttribute('y', cy)
    txt.setAttribute('text-anchor', 'middle')
    txt.setAttribute('dominant-baseline', 'middle')
    txt.setAttribute('font-size', '9')
    txt.setAttribute('font-weight', 'bold')
    txt.setAttribute('font-family', 'system-ui, sans-serif')
    txt.setAttribute('fill', 'white')
    txt.setAttribute('stroke', '#000')
    txt.setAttribute('stroke-width', '2.5')
    txt.setAttribute('paint-order', 'stroke')
    txt.setAttribute('style', 'pointer-events:none')
    txt.textContent = r.name
    g.appendChild(txt)
  })
}

function renderActive() {
  const gFill  = document.getElementById('g-active-fill')
  const gLines = document.getElementById('g-lines')
  gFill.innerHTML = ''
  gLines.innerHTML = ''
  if (!activeId || pts.length < 2) return
  const color = COLORS[activeId]

  // closed-fill preview (semi)
  if (pts.length >= 3) {
    gFill.appendChild(el('polygon', {
      points: pts.map(p => p.join(',')).join(' '),
      fill: color + '30',
      stroke: 'none',
    }))
  }
  // outline
  gLines.appendChild(el('polyline', {
    points: pts.map(p => p.join(',')).join(' '),
    fill: 'none',
    stroke: color,
    'stroke-width': '1.5',
  }))
  // closing line (dashed)
  if (pts.length >= 3) {
    const [fx,fy] = pts[0]
    const [lx,ly] = pts[pts.length-1]
    gLines.appendChild(el('line', { x1:lx,y1:ly, x2:fx,y2:fy, stroke:color+'66', 'stroke-width':'1', 'stroke-dasharray':'4,3' }))
  }
}

function renderPreview() {
  const g = document.getElementById('g-preview')
  g.innerHTML = ''
  if (!activeId || !cursor || pts.length === 0) return
  const [lx,ly] = pts[pts.length-1]
  const [cx,cy] = cursor
  const color = COLORS[activeId]
  g.appendChild(el('line', { x1:lx,y1:ly, x2:cx,y2:cy, stroke:color+'99', 'stroke-width':'1', 'stroke-dasharray':'3,2' }))
}

function renderPoints() {
  const g = document.getElementById('g-pts')
  g.innerHTML = ''
  if (!activeId) return
  const color = COLORS[activeId]
  pts.forEach((p, i) => {
    g.appendChild(el('circle', {
      cx: p[0], cy: p[1],
      r: i === 0 ? 4.5 : 3,
      fill: i === 0 ? '#fff' : color,
      stroke: '#000', 'stroke-width': '0.8',
      style: 'pointer-events:none',
    }))
  })
}

// ─── UI ──────────────────────────────────────────────────────────────────────
function buildList() {
  const list = document.getElementById('range-list')
  list.innerHTML = ''
  RANGES.forEach(r => {
    const color = COLORS[r.id]
    const hasPoly = saved[r.id]?.length >= 3
    const btn = document.createElement('button')
    btn.className = 'rbtn' + (r.id === activeId ? ' active' : '')
    btn.innerHTML = `<span class="dot" style="background:${color}"></span>${r.name}${hasPoly ? '<span class="check">✓</span>' : ''}`
    btn.onclick = () => selectRange(r.id)
    list.appendChild(btn)
  })
}

function updateUI() {
  buildList()
  const btnUndo  = document.getElementById('btn-undo')
  const btnClear = document.getElementById('btn-clear')
  const btnSave  = document.getElementById('btn-save')
  const status   = document.getElementById('status')
  const coords   = document.getElementById('coords-display')

  if (!activeId) {
    status.textContent = 'Sin región activa'
    coords.textContent = '—'
    btnUndo.disabled = btnClear.disabled = btnSave.disabled = true
    return
  }
  const r = RANGES.find(r => r.id === activeId)
  status.textContent = `${r.name}: ${pts.length} punto${pts.length !== 1 ? 's' : ''}`
  btnUndo.disabled  = pts.length === 0
  btnClear.disabled = pts.length === 0
  btnSave.disabled  = pts.length < 3
  coords.textContent = pts.length
    ? pts.map(p => `[${p[0]},${p[1]}]`).join(' ')
    : '—'
}

// ─── Actions ─────────────────────────────────────────────────────────────────
function selectRange(id) {
  activeId = id
  pts = saved[id] ? saved[id].map(p => [...p]) : []
  render()
}

function addPoint(x, y) {
  if (!activeId) return
  pts.push([x, y])
  render()
}

function undoPoint() {
  if (!pts.length) return
  pts.pop()
  render()
}

function clearPoly() {
  pts = []
  render()
}

function savePoly() {
  if (!activeId || pts.length < 3) return
  saved[activeId] = pts.map(p => [...p])
  pts = []
  render()
}

function exportAll() {
  let out = `import type { MountainRange } from '../types/quiz'\n\n`
  out += `// Coordinates in SVG viewBox units (0 0 900 680)\n`
  out += `export const MOUNTAIN_RANGES: MountainRange[] = [\n`

  RANGES.forEach(r => {
    const poly = saved[r.id]?.length >= 3 ? saved[r.id] : (INITIAL[r.id] || [])
    const c = centroid(poly)
    // close the polygon (repeat first point)
    const closed = poly.length >= 3 ? [...poly, poly[0]] : poly
    out += `  {\n    id: '${r.id}',\n    name: '${r.name}',\n`
    out += `    centroid: [${c[0]}, ${c[1]}],\n`
    out += `    polygon: [\n`
    for (let i = 0; i < closed.length; i += 4) {
      const chunk = closed.slice(i, i+4).map(p => `[${p[0]},${p[1]}]`).join(', ')
      out += `      ${chunk},\n`
    }
    out += `    ],\n  },\n`
  })

  out += `]\n\nexport const HIT_TEST_ORDER = [\n`
  HIT_ORDER.forEach(id => { out += `  '${id}',\n` })
  out += `]\n`

  const el = document.getElementById('output')
  el.style.display = 'block'
  el.textContent = out

  navigator.clipboard?.writeText(out)
    .then(() => { el.textContent = '✓ ¡Copiado al portapapeles!\n\n' + out })
    .catch(() => {})
}

// ─── Events ──────────────────────────────────────────────────────────────────
svg.addEventListener('click', e => {
  if (e.detail === 2) return   // ignore double-click (handled by dblclick)
  if (!activeId) return
  const [x, y] = svgCoords(e)
  addPoint(x, y)
})

svg.addEventListener('dblclick', e => {
  // double-click: remove the last point added by the second click, then save
  if (!activeId || pts.length < 3) return
  pts.pop()  // undo the extra point from the second click
  savePoly()
})

svg.addEventListener('mousemove', e => {
  cursor = svgCoords(e)
  const ctxt = document.getElementById('g-cursor-txt')
  if (ctxt) ctxt.textContent = `x:${cursor[0]}  y:${cursor[1]}`
  if (activeId && pts.length > 0) renderPreview()
})

svg.addEventListener('mouseleave', () => {
  cursor = null
  const ctxt = document.getElementById('g-cursor-txt')
  if (ctxt) ctxt.textContent = ''
  renderPreview()
})

document.addEventListener('keydown', e => {
  if (e.key === 'Enter')   { e.preventDefault(); savePoly() }
  if (e.key === 'Escape')  { e.preventDefault(); clearPoly() }
  if (e.key === 'Backspace' || (e.key === 'z' && (e.ctrlKey || e.metaKey))) {
    e.preventDefault()
    undoPoint()
  }
})

// ─── Init ─────────────────────────────────────────────────────────────────────
render()
</script>
</body>
</html>
